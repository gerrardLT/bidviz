[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bidviz"
version = "0.1.0"
description = "施工组织设计图册生成器 —— 把文字型施组转成图表混合的高级工程图册"
requires-python = ">=3.11"
dependencies = [
    "reportlab>=4.0",
    "PyMuPDF>=1.24",
    "Pillow>=10.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Word COM 转换需要 Windows + 装了 Office
windows = ["pywin32>=306"]
dev = ["pytest>=8.0"]

[project.scripts]
bidviz = "bidviz_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "audit_layout", "bidviz", "bidviz_album", "bidviz_charts", "bidviz_classify",
    "bidviz_cli", "bidviz_config", "bidviz_e1", "bidviz_fullimage", "bidviz_fullimage_audit",
    "bidviz_fullimage_store", "bidviz_ingest_tables", "bidviz_issues", "bidviz_layout",
    "bidviz_plan", "bidviz_templates", "bidviz_v2", "bidviz_vector",
    "build_e1", "build_sample_s003", "build_v13", "generate_chapter", "run_pipeline",
]
# 约定：新增 src/*.py 模块必须同步加入上方清单（editable install 依赖它；
# 重构阶段将新增 bidviz_classify / bidviz_imagegen）
