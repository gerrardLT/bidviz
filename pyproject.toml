[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bidviz"
version = "0.1.0"
description = "施工组织设计图册生成器 —— 把文字型施组转成图表混合的高级工程图册"
requires-python = ">=3.11"
dependencies = [
    "reportlab>=4.0",
    "PyMuPDF>=1.24",
    "Pillow>=10.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Word COM 转换需要 Windows + 装了 Office
windows = ["pywin32>=306"]
dev = ["pytest>=8.0"]

[project.scripts]
bidviz = "bidviz_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "bidviz", "bidviz_album", "bidviz_charts", "bidviz_cli", "bidviz_config",
    "bidviz_e1", "bidviz_v2", "bidviz_vector", "build_e1",
    "generate_chapter", "run_pipeline",
]
