<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BidViz 质量把关控制台</title>
<style>
:root{--navy:#0b4776;--blue:#0874bd;--pale:#eaf3f9;--bg:#f4f7fa;--text:#20313f;--muted:#637887;--line:#c8d7e2;--green:#18864b;--greenbg:#e5f5eb;--orange:#b45d08;--orangebg:#fff3d8;--red:#b42318;--redbg:#fdebea;--gray:#687783;--graybg:#eef2f5}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:"Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:var(--text);background:var(--bg)}
body{display:grid;grid-template-columns:280px 1fr;overflow:hidden}.side{background:#092f50;color:#fff;padding:22px 14px;overflow:auto}.side h1{font-size:19px;margin:0 10px 8px}.side p{font-size:12px;color:#b9d3e5;margin:0 10px 20px;line-height:1.6}.nav{display:block;width:100%;border:0;background:transparent;color:#cce0ee;text-align:left;padding:10px 12px;border-radius:8px;margin:3px 0;cursor:pointer;font-size:13px}.nav:hover,.nav.active{background:#0f5b91;color:#fff}.nav .state{float:right;font-size:11px}.main{overflow:auto;padding:30px 38px 90px}.gate{display:none;max-width:1260px;margin:auto}.gate.active{display:block}.hero{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px 28px;margin-bottom:18px}.hero h2{font-size:27px;color:var(--navy);margin:0 0 7px}.hero p{color:var(--muted);margin:0;line-height:1.6}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin:16px 0}.card h3{margin:0 0 15px;color:var(--navy);font-size:18px}.flow{display:flex;align-items:stretch;gap:12px;overflow:auto;padding:8px 0 14px}.node{min-width:160px;flex:1;border:1px solid var(--blue);background:var(--pale);border-radius:9px;padding:13px}.node b{display:block;color:var(--navy);margin-bottom:7px}.node small{line-height:1.6;color:#416277}.node.pending{background:var(--orangebg);border-color:var(--orange)}.node.pass{background:var(--greenbg);border-color:var(--green)}.node.stop{background:var(--redbg);border-color:var(--red)}.arrow{display:flex;align-items:center;font-size:25px;color:var(--blue);min-width:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.matrix{width:100%;border-collapse:collapse;font-size:13px}.matrix th{background:var(--navy);color:#fff;text-align:left;padding:10px}.matrix td{border:1px solid var(--line);padding:10px;vertical-align:top;line-height:1.55}.matrix tr:nth-child(even) td{background:#f8fbfd}.checklist{padding:0;margin:0;list-style:none}.checklist li{padding:8px 0;border-bottom:1px dashed var(--line);line-height:1.45}.checklist li:before{content:"□";color:var(--blue);font-weight:bold;margin-right:8px}.alert{border-left:5px solid var(--red);background:var(--redbg);padding:12px 14px;border-radius:6px;line-height:1.6}.note{border-left:5px solid var(--orange);background:var(--orangebg);padding:12px 14px;border-radius:6px;line-height:1.6}.ok{border-left:5px solid var(--green);background:var(--greenbg);padding:12px 14px;border-radius:6px;line-height:1.6}.decision{display:flex;gap:10px;margin-top:18px;align-items:center}.decision button{border:0;padding:10px 18px;border-radius:7px;color:#fff;font-weight:700;cursor:pointer}.approve{background:var(--green)}.reject{background:var(--red)}.reset{background:var(--gray)}textarea{width:100%;min-height:85px;border:1px solid var(--line);border-radius:7px;padding:10px;font:inherit;margin-top:10px}.statusbar{margin-left:auto;color:var(--muted);font-size:13px}.timeline{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}.step{text-align:center;padding:12px 7px;border:1px solid var(--blue);border-radius:8px;background:var(--pale)}.step b{display:block;color:var(--navy)}.step small{display:block;margin-top:5px}.choice{border:1px solid var(--line);padding:13px;border-radius:9px;background:#fff}.choice h4{margin:0 0 7px;color:var(--navy)}@media(max-width:900px){body{grid-template-columns:1fr}.side{display:none}.main{padding:16px}.grid2,.grid3{grid-template-columns:1fr}.timeline{grid-template-columns:repeat(2,1fr)}}
@media print{body{display:block;overflow:visible}.side,.decision,textarea{display:none}.main{padding:0}.gate{display:block!important;page-break-after:always}.card,.hero{break-inside:avoid}}
</style>
</head>
<body>
<aside class="side"><h1>BidViz 质量把关</h1><p>逐项确认，未通过不进入下一 Gate。中文、参数及阈值均为真实 DOM 文字。</p><nav id="nav"></nav></aside>
<main class="main"><div id="root"></div></main>
<script>
const gates=[
{id:'00',title:'总览',desc:'全图 G0–G5 与矢量签认①–⑥的关系、确认顺序',body:`
<div class="card"><h3>全图渲染主线</h3><div class="flow"><div class="node pass"><b>G0 提示词</b><small>契约 / 禁止项 / 原文注入</small></div><i class="arrow">→</i><div class="node pending"><b>G1 单页样张</b><small>S003 框架 / 参数 / 页码</small></div><i class="arrow">→</i><div class="node"><b>G2 整章一致性</b><small>25 页框架 / 色彩 / 密度</small></div><i class="arrow">→</i><div class="node"><b>G3 文字准确性</b><small>参数逐字 / 原文对照</small></div><i class="arrow">→</i><div class="node"><b>G4 全册</b><small>103 页 / 分章 Gate</small></div><i class="arrow">→</i><div class="node"><b>G5 交付</b><small>全局页码 / 检索层</small></div></div></div>
<div class="grid2"><div class="card"><h3>矢量签认线</h3><div class="flow"><div class="node pending"><b>① tokens / ② S003</b><small>v2 待重签</small></div><i class="arrow">→</i><div class="node pending"><b>③ 模板批</b><small>S012/S018/S019/S029/S054</small></div><i class="arrow">→</i><div class="node"><b>④–⑥</b><small>风格 / 原图表 / final</small></div></div></div><div class="card"><h3>质量红线</h3><div class="alert">数值错字 / 编造内容 / 上下裁切 / 跨页框架错位——任一出现即打回。</div></div></div>`},
{id:'01',title:'系统与路线',desc:'哪些由人决策、AI 生成、代码确定性执行；双路线如何处置',body:`<div class="card"><h3>职责分层</h3><div class="flow"><div class="node pending"><b>人决策</b><small>分类、page-plan、提示词、issues、供应商资格</small></div><i class="arrow">→</i><div class="node"><b>AI 生成</b><small>页面框架、图文内容、可见文字</small></div><i class="arrow">→</i><div class="node pass"><b>代码确定执行</b><small>分页、尺寸验证、隐藏层、PDF、全局页码</small></div></div></div><div class="grid2"><div class="card"><h3>路线 A · 全图主线</h3><p>视觉上限高、内容自适应；风险是错字、漂移、尺寸抽卡。</p></div><div class="card"><h3>路线 B · 矢量退路</h3><p>文字零错、可复现；用于参数密集页或全图路线失败时回退。</p></div></div><div class="note">待确认：全图为当前监督主线；矢量仅保留退路；决策件必须签认后冻结。</div>`},
{id:'02',title:'G0 提示词设计',desc:'输入注入、框架契约、内容保真、自由编排、视觉契约、负面清单',body:`<div class="grid2"><div class="card"><h3>输入注入</h3><ul class="checklist"><li>章名 / 节名 / 首个三级主题</li><li>原文全文；每页≤1500字，每节≤3页</li><li>8 类图像语汇</li><li>样板参考图：只锚定页眉/标题/页脚</li><li>真实项目名，禁止“XX工程项目”占位符</li></ul></div><div class="card"><h3>提示词六层</h3><ol><li>单页竖版约束</li><li>页面框架契约</li><li>内容保真</li><li>内容区自由编排</li><li>视觉契约</li><li>负面清单</li></ol></div></div><div class="card"><h3>负面清单</h3><div class="alert">禁 AI 页码；禁设计单位/审核人/日期/图号；禁英文句子/Logo/水印/二维码；禁原文外工序、参数和承诺。</div></div>`},
{id:'03',title:'G1 单页样张',desc:'S003 的竖版、框架、参数、页码、无裁切、检索层',body:`<div class="card"><h3>生成流程</h3><div class="flow"><div class="node"><b>原文+分类</b><small>1213字 / B工艺型</small></div><i class="arrow">→</i><div class="node"><b>提示词v2</b><small>框架契约+禁止项</small></div><i class="arrow">→</i><div class="node"><b>参考图</b><small>1张框架锚定</small></div><i class="arrow">→</i><div class="node pending"><b>api7900 2K</b><small>2048×2896</small></div><i class="arrow">→</i><div class="node pass"><b>PDF样张</b><small>全局页码+隐藏层</small></div></div></div><div class="card"><h3>验收矩阵</h3><table class="matrix"><tr><th>检查点</th><th>当前证据</th><th>标准</th></tr><tr><td>竖版单页</td><td>2048×2896；非封面/非对开</td><td>必须</td></tr><tr><td>框架一致</td><td>页眉、章标题、节标题、天际线页脚</td><td>肉眼确认</td></tr><tr><td>技术参数</td><td>2至3米 / 0.3m³ / C25 / 150mm / 300mm / 12kN</td><td>逐字全对</td></tr><tr><td>AI页码</td><td>图内无页码</td><td>必须为0</td></tr><tr><td>PDF页码</td><td>底部矢量“— 1 —”</td><td>文本层命中</td></tr><tr><td>无裁切/检索</td><td>contain；Ctrl+F命中原文</td><td>双门禁通过</td></tr></table></div>`},
{id:'04',title:'G2 整章一致性',desc:'25 页抽检时序图、首/中/尾代表页、六维评分、停止条件',body:`<div class="card"><h3>第一章 25 页抽检时序</h3><div class="timeline"><div class="step"><b>P1</b><small>参数页</small></div><div class="step"><b>P4</b><small>S003 工艺</small></div><div class="step"><b>P10</b><small>构造页</small></div><div class="step"><b>P17</b><small>接头页</small></div><div class="step"><b>P25</b><small>检验页</small></div><div class="step"><b>随机×3</b><small>共8/25人工审</small></div></div></div><div class="card"><h3>六维一致性评分</h3><table class="matrix"><tr><th>维度</th><th>方法</th><th>阈值</th></tr><tr><td>页眉位置与高度</td><td>边界差值</td><td>±8 px</td></tr><tr><td>章/节标题</td><td>关键线坐标</td><td>±12 px</td></tr><tr><td>主色板</td><td>颜色聚类</td><td>深蓝/浅蓝灰稳定</td></tr><tr><td>文字密度</td><td>OCR字高+字符量</td><td>无极小字页</td></tr><tr><td>表格/卡片</td><td>表头色/线宽/图标</td><td>不突变</td></tr><tr><td>页脚</td><td>模板匹配</td><td>同位且无AI页码</td></tr></table><div class="alert">连续2页超阈值，立即暂停批量生成并退回G0。</div></div>`},
{id:'05',title:'G3 文字准确性',desc:'Diff 流程图 + P0–P3 分级矩阵',body:`<div class="card"><h3>逐字 Diff 流程</h3><div class="flow"><div class="node"><b>原文期望串</b><small>标题/参数/单位/表格/正文</small></div><i class="arrow">→</i><div class="node"><b>区域裁剪</b><small>标题/KPI/表格/正文</small></div><i class="arrow">→</i><div class="node pending"><b>OCR/VLM回读</b><small>保留原始串</small></div><i class="arrow">→</i><div class="node"><b>归一化</b><small>空白/全半角/单位</small></div><i class="arrow">→</i><div class="node stop"><b>逐字Diff</b><small>数字单位单独标红</small></div></div></div><div class="card"><h3>分级门禁</h3><table class="matrix"><tr><th>级别</th><th>对象</th><th>阈值</th></tr><tr><td>P0</td><td>项目/章/节/KPI/型号/单位</td><td>零容错</td></tr><tr><td>P1</td><td>风险条件/验收条件/承诺时限/顺序</td><td>零容错</td></tr><tr><td>P2</td><td>普通正文每页抽3段</td><td>累计≥2处重画</td></tr><tr><td>P3</td><td>表格首/中/末行+所有数字</td><td>错位或串列重画</td></tr></table></div><div class="alert">已知风险：3295m→3293m；“XX工程项目”；AI自造页码。三类必须专项扫描。</div>`},
{id:'06',title:'业务 issues',desc:'7 条 open issue 的确认、修正、豁免与留痕',body:`<div class="card"><h3>状态机</h3><div class="flow"><div class="node stop"><b>OPEN</b><small>自动规则命中，阻断final</small></div><i class="arrow">→</i><div class="node pending"><b>人工决断</b><small>看原文/位置/证据</small></div><i class="arrow">→</i><div class="node pass"><b>CONFIRMED</b><small>采用指定口径</small></div><div class="node"><b>WAIVED</b><small>豁免但必须留痕</small></div><i class="arrow">→</i><div class="node"><b>锁定页面口径</b></div><i class="arrow">→</i><div class="node pass"><b>PASS</b><small>open=0</small></div></div></div><div class="grid2"><div class="card"><h3>当前7条</h3><ul><li>缺单位×2：如“C25混凝土60厚”</li><li>口径冲突×1：1h vs 8h</li><li>模糊承诺×3：“约/左右”</li><li>不可推日期×1：仅有60日历天</li></ul></div><div class="card"><h3>每条必填</h3><p>原文摘录、block_id/source_page、建议口径、状态、决断人、时间、证据。缺一项不得关闭。</p></div></div>`},
{id:'07',title:'G4 全册生成',desc:'103 页分章 Gate、成本与停止条件',body:`<div class="card"><h3>九章生产时序</h3><div class="timeline"><div class="step"><b>总述</b><small>1页</small></div><div class="step"><b>一章</b><small>25页</small></div><div class="step"><b>二章</b><small>9页</small></div><div class="step"><b>三章</b><small>14页</small></div><div class="step"><b>四章</b><small>13页</small></div><div class="step"><b>五章</b><small>18页</small></div><div class="step"><b>六章</b><small>6页</small></div><div class="step"><b>七章</b><small>12页</small></div><div class="step"><b>八章</b><small>5页</small></div></div></div><div class="grid2"><div class="card"><h3>每章 Gate</h3><ul class="checklist"><li>页数与page-plan一致</li><li>实际宽度≥2048</li><li>首/中/尾框架一致</li><li>按G3抽验文字</li><li>单章PDF无裁切、页码连续、可搜索</li></ul></div><div class="card"><h3>成本与停止</h3><p>103页×¥0.08=¥8.24；含50%余量¥12.36。</p><div class="alert">尺寸不达标率>20%，或连续2页错字/框架漂移，暂停该章。</div></div></div>`},
{id:'08',title:'供应商门禁',desc:'尺寸、锐度、稳定性、参考图、成本与资格矩阵',body:`<div class="card"><h3>当前生产顺序</h3><div class="flow"><div class="node pass"><b>第一优先级</b><small>api7900 / gpt-image-2 / 2048×2896 / ¥0.08</small></div><i class="arrow">→</i><div class="node pending"><b>第二优先级</b><small>yoshub / gpt-image-2-2K/4K</small></div><i class="arrow">→</i><div class="node stop"><b>其他通道</b><small>仅档案，不自动使用</small></div></div></div><div class="card"><h3>资格矩阵</h3><table class="matrix"><tr><th>通道</th><th>实际尺寸</th><th>锐度</th><th>坑位</th><th>结论</th></tr><tr><td>api7900 gpt-image-2</td><td>2048×2896</td><td>极佳</td><td>4K档仅2416×3424且略软</td><td>主力2K</td></tr><tr><td>yoshub gpt-image-2</td><td>2352×3520</td><td>当前最锐</td><td>池间歇503</td><td>回退</td></tr><tr><td>taomu 2.5</td><td>2048或1055抽卡</td><td>略软</td><td>需重掷</td><td>档案</td></tr><tr><td>grok imagine</td><td>768–1664宽</td><td>低/中</td><td>无视size、可能编造</td><td>淘汰</td></tr><tr><td>toapis official</td><td>2048×2896</td><td>好</td><td>异步、8.36积分/张</td><td>档案</td></tr></table></div>`},
{id:'09',title:'G5 PDF 汇编',desc:'contain 无损置入、24pt 页码带、全局页码、隐藏层',body:`<div class="card"><h3>汇编流水线</h3><div class="flow"><div class="node"><b>整页PNG</b><small>候选取最高质量</small></div><i class="arrow">→</i><div class="node pass"><b>contain等比</b><small>不裁上下</small></div><i class="arrow">→</i><div class="node"><b>底部24pt白带</b><small>图不进入页码带</small></div><i class="arrow">→</i><div class="node pass"><b>矢量全局页码</b><small>— N —，1..103</small></div><i class="arrow">→</i><div class="node"><b>隐藏检索层</b><small>原文全文可Ctrl+F</small></div></div></div><div class="grid2"><div class="card"><h3>自动门禁</h3><ul class="checklist"><li>103页无缺重空白</li><li>A3竖版297×420mm</li><li>图片bbox在媒介框内</li><li>页码1..103仅底部居中</li><li>AI图内OCR无页码</li><li>每章关键词可搜索</li><li>目录书签与页码对应</li></ul></div><div class="card"><h3>肉眼门禁</h3><ul class="checklist"><li>首/章切换/末页页码</li><li>上下页眉页脚完整</li><li>左右白边自然</li><li>100%缩放小字清晰</li><li>连续翻页节奏稳定</li></ul></div></div>`},
{id:'10',title:'矢量签认点',desc:'tokens、S003、模板批、风格种子、原图表、最终签发',body:`<div class="card"><h3>①–⑥ 时序</h3><div class="flow"><div class="node pending"><b>① tokens v1.1</b><small>色板/字号/间距</small></div><i class="arrow">→</i><div class="node pending"><b>② S003 v2</b><small>contact sheet / 哈希</small></div><i class="arrow">→</i><div class="node pending"><b>③ 模板批</b><small>B/D/E/H 代表页</small></div><i class="arrow">→</i><div class="node"><b>④ 风格种子</b></div><i class="arrow">→</i><div class="node"><b>⑤ 原图表</b><small>47表+60图</small></div><i class="arrow">→</i><div class="node"><b>⑥ Final</b></div></div></div><div class="note">建议：若全图路线G2/G3通过，矢量路线保留为参数密集页退路，不继续投入阶段4–7。</div>`},
{id:'11',title:'最终路线拍板',desc:'依据第一章实测选择全图、矢量或混合',body:`<div class="card"><h3>决策树</h3><div class="flow"><div class="node pending"><b>Q1 框架一致？</b></div><i class="arrow">→</i><div class="node pending"><b>Q2 P0/P1零错？</b></div><i class="arrow">→</i><div class="node pending"><b>Q3 屏显质量优于矢量？</b></div></div><div class="grid3"><div class="choice"><h4>否：退回G0</h4><p>加强契约/参考图，重跑S003及整章。</p></div><div class="choice"><h4>部分失败：混合</h4><p>场景页全图；参数/时效/检验页矢量；关键数字叠印。</p></div><div class="choice"><h4>全部通过：全图</h4><p>章章Gate生成103页，进入G4→G5。</p></div></div></div><div class="ok">此页不提前拍板；先完成G0→G1→G2→G3，用第一章真实证据选择。</div>`}
];
const nav=document.getElementById('nav'),root=document.getElementById('root');
function saved(id){return JSON.parse(localStorage.getItem('bidviz-gate-'+id)||'{"status":"pending","note":""}')}
function render(){nav.innerHTML='';root.innerHTML='';gates.forEach((g,i)=>{const s=saved(g.id);const b=document.createElement('button');b.className='nav'+(i===0?' active':'');b.dataset.id=g.id;b.innerHTML=`${g.id} ${g.title}<span class="state">${s.status==='approved'?'通过':s.status==='rejected'?'退回':'待签'}</span>`;nav.appendChild(b);const sec=document.createElement('section');sec.className='gate'+(i===0?' active':'');sec.id='g-'+g.id;sec.innerHTML=`<div class="hero"><h2>${g.id} · ${g.title}</h2><p>${g.desc}</p></div>${g.body}<div class="card"><h3>把关结论</h3><textarea placeholder="记录修改意见、证据或签认备注">${s.note}</textarea><div class="decision"><button class="approve">通过</button><button class="reject">退回修改</button><button class="reset">清除状态</button><span class="statusbar">当前：${s.status==='approved'?'已通过':s.status==='rejected'?'已退回':'待签认'}</span></div></div>`;root.appendChild(sec)});bind()}
function bind(){document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav,.gate').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('g-'+b.dataset.id).classList.add('active')});document.querySelectorAll('.gate').forEach(sec=>{const id=sec.id.slice(2),ta=sec.querySelector('textarea');sec.querySelector('.approve').onclick=()=>save(id,'approved',ta.value);sec.querySelector('.reject').onclick=()=>save(id,'rejected',ta.value);sec.querySelector('.reset').onclick=()=>{localStorage.removeItem('bidviz-gate-'+id);render()};ta.onchange=()=>save(id,saved(id).status,ta.value,false)})}
function save(id,status,note,rerender=true){localStorage.setItem('bidviz-gate-'+id,JSON.stringify({status,note,at:new Date().toISOString()}));if(rerender)render()}
render();
</script>
</body></html>
