# 安科生物项目 35kV 电力接入工程 · 施工组织设计图册

[project]
name = "安科生物项目"
voltage = "35kV"
doc_type = "施工组织设计"
header = "安科生物项目 35kV 电力接入工程 · 施工组织设计"
standard = "执行国家电网 35kV 施工质量验收规范通用评定标准"
client = "安科生物"

[image]
provider = "api7900"            # 主通道：https://api.790053500.com/v1
model = "gpt-image-2"           # 2K 档
size = "2048x2896"              # A3 竖版 2K
fallback_provider = "grokimg"   # 仅失败时回退 yoshub
fallback_model = "gpt-image-2-2K/4K"
dir = "work/fullimage"
retries = 3
pause = 1.5

[layout]
engine = "fullimage"            # Web/CLI 当前主线；legacy 仍保留可切换

[paths]
inputs = "inputs"
work = "work"
output = "output"

[ingest]
chapter_pattern = "^第[一二三四五六七八九十]+章"
section_pattern = "^第[一二三四五六七八九十]+节"
min_chars = 220

[compact]
# 本项目招标要求：总页数 45–50（含封面）。其他项目按各自要求改这里，0 = 不限制。
min_pages = 45
max_pages = 50
max_chars_per_page = 2000
max_sections_per_page = 2
