# 安科生物项目 35kV 电力接入工程 · 施工组织设计图册

[project]
name = "安科生物项目"
voltage = "35kV"
doc_type = "施工组织设计"
header = "安科生物项目 35kV 电力接入工程 · 施工组织设计"
standard = "执行国家电网 35kV 施工质量验收规范通用评定标准"
client = "安科生物"

[image]
provider = "api7900"            # 第一优先级：https://api.790053500.com/v1 (¥0.08/张)
model = "gpt-image-2"           # 2K 档
size = "2048x2896"              # A3 竖版满额 2K (1:1.414)
fallback_provider = "yoshub"    # 第二优先级回退：yoshub
fallback_model = "gpt-image-2-2K/4K"
dir = "work/fullimage"          # 主视觉输出目录
retries = 3
pause = 1.5

[paths]
inputs = "inputs"
work = "work"
output = "output"

[ingest]
chapter_pattern = "^第[一二三四五六七八九十]+章"
section_pattern = "^第[一二三四五六七八九十]+节"
min_chars = 220
